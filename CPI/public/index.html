<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image CAPTCHA</title>
    <!-- Correct the link rel attribute -->
    <link rel="stylesheet" href="styles.css">
</head>

<body bgcolor="#373e4a">


	<h1><font color=white face="Segoe UI light" ><center>SELECT ALL IMAGES WITH CARS</center></h1>
	<div class="timer" id="timer"><center>Time left: <span id="time">30</span> seconds</center></font></div>
    <marquee behavior="alternate"
	<div class="image-grid">
            <img src="images/cat1.jpg" alt="Cat 1" class="captcha-image" data-correct="true">
            <img src="images/dog1.jpg" alt="Dog" class="captcha-image" data-correct="false">
            <img src="images/cat2.jpg" alt="Cat 2" class="captcha-image" data-correct="true">
            <img src="images/dog2.jpg" alt="Bird" class="captcha-image" data-correct="false">
            <img src="images/cat3.jpg" alt="Cat 3" class="captcha-image" data-correct="true">
            <img src="images/dog3.jpg" alt="Rabbit" class="captcha-image" data-correct="false">
            <img src="images/cat4.jpg" alt="Cat 3" class="captcha-image" data-correct="true">
            <img src="images/dog4.jpg" alt="Rabbit" class="captcha-image" data-correct="false">
            <img src="images/cat5.jpg" alt="Cat 3" class="captcha-image" data-correct="true">
            
            <!-- More images -->
    </div>


     
</marquee>
    <button class="button button5"><font face="arial"<b>Submit</font></b></button>
    <div class="loader"></div>
    
    <script src="image-captcha.js"></script>
    <p><tab><font face="Segoe UI light" color="white" ><center>THIS IS TEST TO SEE IF BOTS CAN GET THIS TO WORK (MYT BE INCONVENIENT FOR THE USER (LIKE VERY  OLD PPL | PPL WHO HATE GAMING))</center></font></tab></p>
</body>
</html>
